name: gameday

# Two long-running jobs per day pace refreshes off the actual puck-drop times (see scripts/gameday.py):
# every 10 minutes while a game starts within 2 hours, idle otherwise, stop after the last puck drop.
on:
  schedule:
    - cron: "0 15 * * *"    # 8:00 AM Arizona, covers early games
    - cron: "45 20 * * *"   # 1:45 PM Arizona, covers the evening slate
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gameday
  cancel-in-progress: true   # the afternoon job takes over from the morning job

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh around puck drops
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_MIN: "340"
        run: |
          git config user.name "nhl-model-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/gameday.py
